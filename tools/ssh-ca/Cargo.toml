[package]
name = "ssh-ca"
version = "0.1.0"
edition = "2024"
description = "Issue OpenSSH user certificates from trusted hardware-backed CAs"
license = "MIT"
publish = false

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive", "env"] }
rand_core = { version = "0.6", features = ["getrandom"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ssh-agent-lib = { version = "0.6", default-features = false }
ssh-key = { version = "0.6", features = ["ed25519", "p256", "rand_core", "std"] }
tempfile = "3"
ctrlc = "3"

[dev-dependencies]
